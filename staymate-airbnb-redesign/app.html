<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StayMate — Airbnb-style Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#ff385c;
    --primary-active:#e00b41;
    --primary-disabled:#ffd1da;
    --ink:#222222;
    --body:#3f3f3f;
    --muted:#6a6a6a;
    --muted-soft:#929292;
    --hairline:#dddddd;
    --hairline-soft:#ebebeb;
    --border-strong:#c1c1c1;
    --canvas:#ffffff;
    --surface-soft:#f7f7f7;
    --surface-strong:#f2f2f2;
    --on-primary:#ffffff;
    --emerald:#008a05;
    --emerald-bg:#e5f6e6;
    --sky:#0f7dc2;
    --sky-bg:#e7f3fb;
    --amber:#b45900;
    --amber-bg:#fff2e0;
    --rose:#c13515;
    --rose-bg:#fdeae5;
    --r-xs:4px; --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:32px; --r-full:9999px;
    --shadow: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Inter',-apple-system,system-ui,Roboto,'Helvetica Neue',sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #fff5f2 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #fff0f4 0%, transparent 55%),
      #fafafa;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px 16px;
  }
  .stage{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .stage-label{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.02em;}
  .stage-label b{color:var(--primary);}

  /* ---------- Phone frame ---------- */
  .phone{
    width:390px; height:844px; background:#0b0b0c; border-radius:54px; padding:12px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.15);
    position:relative;
  }
  .phone::before{ /* speaker/camera pill */
    content:''; position:absolute; top:26px; left:50%; transform:translateX(-50%);
    width:100px; height:22px; background:#0b0b0c; border-radius:20px; z-index:30;
  }
  .phone-inner{
    width:100%; height:100%; background:var(--canvas); border-radius:42px; overflow:hidden;
    position:relative; display:flex; flex-direction:column;
  }
  .statusbar{
    height:48px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; font-size:15px; font-weight:600; color:var(--ink); position:relative; z-index:20; background:var(--canvas);
  }
  .statusbar .icons{display:flex; align-items:center; gap:5px;}

  .screen-area{flex:1; overflow-y:auto; position:relative; background:var(--canvas); scrollbar-width:none;}
  .screen-area::-webkit-scrollbar{display:none;}
  .pad{padding:4px 20px 110px;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:absolute; left:16px; right:16px; bottom:16px; height:68px; z-index:40;
    background:rgba(255,255,255,.88); backdrop-filter:blur(16px);
    border:1px solid var(--hairline-soft); border-radius:var(--r-full);
    box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:space-around; padding:0 8px;
  }
  .tab{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted-soft); font-family:inherit; font-size:10.5px; font-weight:600; cursor:pointer; flex:1; padding:6px 0;}
  .tab.active{color:var(--ink);}
  .tab .dot{width:4px; height:4px; border-radius:50%; background:var(--primary); opacity:0; margin-top:1px;}
  .tab.active .dot{opacity:1;}
  .tab-fab{
    width:56px; height:56px; border-radius:50%; background:linear-gradient(155deg,#ff5a7a,var(--primary) 60%,var(--primary-active));
    display:flex; align-items:center; justify-content:center; color:#fff; margin-top:-30px;
    box-shadow: 0 10px 24px -4px rgba(255,56,92,.55), 0 0 0 6px #fff;
    border:none; cursor:pointer; flex-shrink:0;
  }
  .tab-fab-label{font-size:10.5px; font-weight:700; color:var(--primary); margin-top:2px;}

  svg.icon{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  /* ---------- Typography ---------- */
  h1,h2,h3,p{margin:0;}
  .display-lg{font-size:22px; font-weight:600; letter-spacing:-.4px; line-height:1.2;}
  .display-md{font-size:20px; font-weight:700; line-height:1.25;}
  .title-md{font-size:16px; font-weight:600;}
  .title-sm{font-size:15px; font-weight:500;}
  .body-md{font-size:15px; font-weight:400; color:var(--body); line-height:1.5;}
  .body-sm{font-size:13.5px; font-weight:400; color:var(--muted);}
  .caption{font-size:12.5px; font-weight:500; color:var(--muted);}
  .micro{font-size:11px; font-weight:700; letter-spacing:.02em;}

  /* ---------- Buttons ---------- */
  .btn{font-family:inherit; border:none; cursor:pointer; border-radius:var(--r-sm); font-size:15px; font-weight:600; height:50px; display:flex; align-items:center; justify-content:center; gap:8px; width:100%;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:active{background:var(--primary-active);}
  .btn-secondary{background:#fff; color:var(--ink); border:1px solid var(--ink);}
  .btn-soft{background:var(--surface-strong); color:var(--ink);}
  .btn-text{background:none; color:var(--ink); font-weight:600; height:auto; width:auto;}
  .btn-sm{height:36px; font-size:13.5px; padding:0 16px; width:auto; border-radius:var(--r-full);}

  /* ---------- Common bits ---------- */
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:var(--r-full);
    font-size:12.5px; font-weight:600; border:1px solid var(--hairline); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .card{background:#fff; border:1px solid var(--hairline-soft); border-radius:var(--r-md); box-shadow:var(--shadow);}
  .avatar{width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#ffd1da,#ff9db0); display:flex; align-items:center; justify-content:center; font-weight:700; color:#8a0030; flex-shrink:0; font-size:15px;}
  .divider{height:1px; background:var(--hairline-soft); border:none; margin:16px 0;}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--r-full); display:inline-flex; align-items:center; gap:4px;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:#17b26a; box-shadow:0 0 0 3px #e5f9ee;}

  /* ---------- Overlay full screens ---------- */
  .overlay{position:absolute; inset:0; background:#fff; z-index:80; display:none; flex-direction:column;}
  .overlay.show{display:flex;}
  .overlay-header{flex:0 0 auto; padding:18px 20px 12px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--hairline-soft);}
  .icon-btn{width:34px; height:34px; border-radius:50%; background:var(--surface-strong); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0;}
  .overlay-body{flex:1; overflow-y:auto; scrollbar-width:none;}
  .overlay-body::-webkit-scrollbar{display:none;}

  /* ---------- Bottom sheet ---------- */
  .scrim{position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:90; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .scrim.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:24px 24px 0 0; z-index:91;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); max-height:82%; display:flex; flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,.2);
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--hairline); border-radius:var(--r-full); margin:10px auto 6px;}
  .sheet-body{overflow-y:auto; padding:6px 20px 28px; scrollbar-width:none;}
  .sheet-body::-webkit-scrollbar{display:none;}

  /* ---------- Dashboard specific ---------- */
  .metric-card{background:#fff; border:1px solid var(--hairline-soft); border-radius:var(--r-md); padding:14px; box-shadow:var(--shadow);}
  .metric-num{font-size:26px; font-weight:700; letter-spacing:-.5px;}
  .search-pill{
    flex:1; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--hairline);
    border-radius:var(--r-full); padding:13px 18px; box-shadow:var(--shadow); color:var(--muted); cursor:pointer;
  }
  .reports-btn{width:48px; height:48px; border-radius:50%; background:#fff; border:1px solid var(--hairline); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0; position:relative;}
  .guest-row{display:flex; gap:12px; align-items:center; padding:12px 0; cursor:pointer;}

  /* ---------- Scanner ---------- */
  .doc-type-card{border:1.5px solid var(--hairline); border-radius:var(--r-md); padding:16px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; background:#fff;}
  .doc-type-card.active{border-color:var(--ink); background:var(--surface-soft);}
  .viewfinder{
    aspect-ratio:3/4; border-radius:var(--r-lg); position:relative; overflow:hidden;
    background:linear-gradient(160deg,#20242b,#33383f 55%,#20242b);
  }
  .frame-guide{position:absolute; inset:14%; border:2.5px dashed rgba(255,255,255,.55); border-radius:16px;}
  .corner{position:absolute; width:26px; height:26px; border:3px solid #fff;}
  .corner.tl{top:12%; left:12%; border-right:none; border-bottom:none; border-radius:8px 0 0 0;}
  .corner.tr{top:12%; right:12%; border-left:none; border-bottom:none; border-radius:0 8px 0 0;}
  .corner.bl{bottom:12%; left:12%; border-right:none; border-top:none; border-radius:0 0 0 8px;}
  .corner.br{bottom:12%; right:12%; border-left:none; border-top:none; border-radius:0 0 8px 0;}
  .cam-controls{position:absolute; bottom:14px; left:0; right:0; display:flex; align-items:center; justify-content:space-around; padding:0 20px;}
  .cam-icon-btn{width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer;}
  .shutter{width:64px; height:64px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,.4); cursor:pointer;}
  .cam-top{position:absolute; top:14px; left:0; right:0; display:flex; justify-content:space-between; padding:0 16px;}

  /* ---------- Rooms ---------- */
  .room-card{border:1px solid var(--hairline-soft); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow); background:#fff; cursor:pointer;}
  .room-photo{height:74px; display:flex; align-items:flex-end; padding:8px; position:relative;}
  .status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:var(--r-full); position:absolute; top:8px; left:8px;}

  /* ---------- Settings ---------- */
  .settings-row{display:flex; align-items:center; gap:14px; padding:14px 0; cursor:pointer;}
  .settings-icon{width:36px; height:36px; border-radius:10px; background:var(--surface-strong); display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0;}
  .usage-track{height:8px; border-radius:var(--r-full); background:var(--surface-strong); overflow:hidden;}
  .usage-fill{height:100%; border-radius:var(--r-full); background:var(--primary);}

  /* ---------- Pricing ---------- */
  .plan-card{border:1.5px solid var(--hairline); border-radius:var(--r-lg); padding:20px; position:relative; background:#fff;}
  .plan-card.featured{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary);}
  .toggle-track{background:var(--surface-strong); border-radius:var(--r-full); padding:4px; display:flex; position:relative;}
  .toggle-opt{flex:1; text-align:center; padding:8px 10px; font-size:13px; font-weight:600; border-radius:var(--r-full); position:relative; z-index:2; cursor:pointer; color:var(--muted);}
  .toggle-opt.active{color:#fff;}
  .toggle-thumb{position:absolute; top:4px; bottom:4px; width:calc(50% - 4px); background:var(--ink); border-radius:var(--r-full); transition:transform .22s ease; z-index:1;}

  /* ---------- PIN screen ---------- */
  .pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--ink);}
  .pin-dot.filled{background:var(--ink);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .key{aspect-ratio:1; border-radius:50%; border:none; background:var(--surface-soft); font-size:22px; font-weight:500; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .key:active{background:var(--surface-strong);}

  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  @media (max-width:430px){
    body{padding:0;}
    .stage-label{display:none;}
    .phone{width:100vw; height:100vh; border-radius:0; padding:0;}
    .phone::before{display:none;}
    .phone-inner{border-radius:0;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-label">StayMate — redesigned in the <b>Airbnb</b> visual language · tap around, it's fully interactive</div>
  <div class="phone">
    <div class="phone-inner">
      <div class="statusbar">
        <span id="clock">9:41</span>
        <div class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="1" width="4" height="10" rx="1" fill="#222"/><rect x="5.5" y="1" width="4" height="10" rx="1" fill="#222"/><rect x="11" y="1" width="4" height="10" rx="1" fill="#222"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2C10.5 2 12.8 3 14.5 4.7L13.1 6.1C11.7 4.7 9.9 4 8 4C6.1 4 4.3 4.7 2.9 6.1L1.5 4.7C3.2 3 5.5 2 8 2Z" fill="#222"/><circle cx="8" cy="9" r="1.6" fill="#222"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="#222" stroke-width="1"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.3" fill="#222"/><rect x="22" y="4" width="1.5" height="4" rx="0.7" fill="#222"/></svg>
        </div>
      </div>

      <div class="screen-area" id="screenArea"></div>

      <nav class="tabbar" id="tabbar">
        <button class="tab" data-tab="dashboard" onclick="showTab('dashboard')"></button>
        <button class="tab" data-tab="rooms" onclick="showTab('rooms')"></button>
        <button class="tab-fab" onclick="showTab('scanner')" aria-label="Check-in"></button>
        <button class="tab" data-tab="settings" onclick="showTab('settings')"></button>
      </nav>

      <!-- overlays -->
      <div class="overlay" id="overlaySearch"></div>
      <div class="overlay" id="overlayReview"></div>
      <div class="overlay" id="overlayReports"></div>
      <div class="overlay" id="overlayPricing"></div>

      <!-- sheets -->
      <div class="scrim" id="scrim" onclick="closeSheet()"></div>
      <div class="sheet" id="guestSheet"></div>
      <div class="sheet" id="docSheet"></div>
    </div>
  </div>
</div>

  document.getElementById('clock').textContent = `${h}:${m}`;

function showTab(name){

        <button class="btn-sm btn-soft" style="border:none;" onclick="alert('Add another guest to this same stay.')">${icon('plus',14)} Add</button>
      </div>
      <div class="body-sm">No co-guests added yet</div>

      <div class="caption" style="margin:18px 0 8px;">STAY DETAILS</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${selectField('Room','Room 204 · Deluxe')}
        ${selectField('Rate','₹2,600 / night')}
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${field('Check-in','18 Aug 2026')}
        ${field('Check-out','21 Aug 2026')}
      </div>

      <button class="btn btn-primary" style="margin-top:20px;" onclick="completeCheckin()">${icon('check',17)} Complete check-in</button>
    </div></div>`;
  ov.classList.add('show');
}
function field(label,val){
  return `<div style="margin-bottom:12px;">
    <label class="caption" style="display:block; margin-bottom:6px;">${label}</label>
    <input value="${val}" style="width:100%; height:48px; border:1px solid var(--hairline); border-radius:var(--r-sm); padding:0 14px; font-family:inherit; font-size:14.5px; color:var(--ink); outline:none;">
  </div>`;
}
function selectField(label,val){
  return `<div style="margin-bottom:12px;">
    <label class="caption" style="display:block; margin-bottom:6px;">${label}</label>
    <div class="row between" style="height:48px; border:1px solid var(--hairline); border-radius:var(--r-sm); padding:0 14px; font-size:14.5px;">
      <span>${val}</span>${icon('chevronRight',15)}
    </div>
  </div>`;
}
function completeCheckin(){
  closeOverlay('overlayReview');
  showTab('dashboard');
}

      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#ff6b85); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;">SM</div>
      <div style="flex:1;">
        <div class="title-md">Sunrise Homestay</div>
        <div class="body-sm">HS-4821 · Homestay Owner</div>

    <div class="card" style="margin-top:14px; padding:16px;">
      <div class="row between">
        <div><div class="title-sm">Professional plan</div><div class="body-sm">12 days left on trial</div></div>
        <span class="badge" style="background:var(--surface-strong); color:var(--ink);">PRO</span>
      </div>
      <div style="margin-top:14px;">
        <div class="row between caption" style="margin-bottom:5px;"><span>Check-ins</span><span>84 / 100</span></div>

      </div>
      <div style="margin-top:12px;">

      </div>
      <div class="row between" style="margin-top:12px;">

      </div>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="openPricing()">View plans &amp; upgrade</button>
    </div>

    <div class="caption" style="margin:20px 0 4px;">DATA STORAGE</div>
    <div class="settings-row" onclick="alert('Switch between Cloud sync and 100% offline Local mode.')">
      <span class="settings-icon">${icon('cloud',18)}</span>
      <div style="flex:1;"><div class="title-sm">Cloud mode</div><div class="body-sm">Synced live across staff devices</div></div>
      ${toggleSwitch(true)}
    </div>

    <div class="caption" style="margin:16px 0 4px;">GENERAL</div>
    ${settingsRow('mapPin','Property name & address')}
    ${settingsRow('globe','Language — English')}
    ${settingsRow('moon','Theme — System default')}

    <div class="caption" style="margin:16px 0 4px;">SECURITY</div>
    ${settingsRow('lock','Change security PIN')}
    <div class="settings-row">
      <span class="settings-icon">${icon('fingerprint',18)}</span>
      <div style="flex:1;"><div class="title-sm">Biometric unlock</div><div class="body-sm">Face ID / Fingerprint</div></div>

    <div class="row" style="gap:10px; margin-top:24px;">
      <button class="btn btn-soft" onclick="lockApp()">${icon('lock',16)} Lock app</button>
      <button class="btn btn-secondary" style="color:var(--rose); border-color:var(--rose);">${icon('logout',16)} Log out</button>

}
function settingsRow(iconName,label){
  return `<div class="settings-row" onclick="alert('${label}')">

function toggleSwitch(on){

/* ---------- Pricing overlay ---------- */
function openPricing(){
  const ov = document.getElementById('overlayPricing');
  renderPricing();
  ov.classList.add('show');
}
function renderPricing(){
  const ov = document.getElementById('overlayPricing');
  ov.innerHTML = `
    <div class="overlay-header">
      <button class="icon-btn" onclick="closeOverlay('overlayPricing')">${icon('x',17)}</button>
      <span class="title-md">Plans &amp; pricing</span>
    </div>
    <div class="overlay-body"><div class="pad" style="padding-top:16px;">
      <div class="toggle-track" style="width:220px; margin:0 auto 22px;">
        <div class="toggle-thumb" style="transform:translateX(${billingAnnual?'100%':'0'});"></div>
        <div class="toggle-opt ${!billingAnnual?'active':''}" onclick="setBilling(false)">Monthly</div>
        <div class="toggle-opt ${billingAnnual?'active':''}" onclick="setBilling(true)">Annual · save 15%</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:14px;">
        ${PLANS.map(p=>`
          <div class="plan-card ${p.tag?'featured':''}">

              <span class="title-md">${p.name}</span>
              <span class="display-md">${p.priceM===null?'Custom':(p.priceM===0?'Free':'₹'+(billingAnnual?Math.round(p.priceY/12):p.priceM).toLocaleString('en-IN'))}${p.priceM?'<span class="caption">/mo</span>':''}</span>
            </div>
            <div class="body-sm" style="margin-top:8px;">${p.rooms}</div>
            <div class="body-sm">${p.checkins}</div>

              ${icon('check',15)}<span class="body-sm">${p.ocr?'AI Document OCR included':'OCR not included'}</span>
            </div>
            <button class="btn ${p.tag?'btn-primary':'btn-secondary'}" style="margin-top:14px; height:44px;">${p.priceM===null?'Contact sales':'Choose plan'}</button>
          </div>
        `).join('')}
      </div>
    </div></div>`;
}
function setBilling(v){ billingAnnual=v; renderPricing(); }

/* ---------- Sheets / overlays plumbing ---------- */
function openSheet(id){
  document.getElementById('scrim').classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
}
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

/* ===================== AUTH / PIN ===================== */
function renderPin(mode){ // mode: 'setup' | 'unlock'
  return `
  <div class="fade-in" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 30px;">
    <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary),#ff6b85); display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:22px;">${icon('lock',28)}</div>
    <h1 class="display-lg" style="text-align:center;">${mode==='unlock'?'Welcome back':'Set your PIN'}</h1>
    <p class="body-sm" style="text-align:center; margin-top:6px;">${mode==='unlock'?'Enter your 4-digit PIN to unlock StayMate':'Choose a 4-digit PIN to secure the app'}</p>
    <div class="row" style="gap:14px; margin:30px 0;" id="pinDots">
      ${[0,1,2,3].map(i=>`<div class="pin-dot" id="dot${i}"></div>`).join('')}
    </div>
    <div class="keypad" style="width:240px;">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="pressKey('${n}','${mode}')">${n}</button>`).join('')}
      <button class="key" onclick="pressBiometric('${mode}')" style="color:var(--primary);">${icon('fingerprint',22)}</button>
      <button class="key" onclick="pressKey('0','${mode}')">0</button>
      <button class="key" onclick="pressBack()">${icon('chevronLeft',20)}</button>
    </div>
  </div>`;
}
function pressKey(n, mode){
  if(pinBuffer.length>=4) return;
  pinBuffer += n;
  updateDots();
  if(pinBuffer.length===4){
    setTimeout(()=>{ unlockApp(); }, 250);
  }
}
function pressBack(){ pinBuffer = pinBuffer.slice(0,-1); updateDots(); }
function pressBiometric(mode){ unlockApp(); }
function updateDots(){
  for(let i=0;i<4;i++){
    const d = document.getElementById('dot'+i);
    if(d) d.classList.toggle('filled', i<pinBuffer.length);
  }
}
function unlockApp(){
  pinBuffer='';
  tabbar.style.display='flex';
  document.querySelectorAll('.tab')[0].classList.add('active');
  showTab('dashboard');
}
function lockApp(){
  tabbar.style.display='none';
  screenArea.innerHTML = renderPin('unlock');
}

/* ===================== INIT ===================== */
tabbar.style.display='none';
screenArea.innerHTML = renderPin('unlock');
</script>
